name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=Prakhar1-8&theme=tokyonight&column=6&margin-w=15&margin-h=15"
          path: assets/trophies.svg
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

      - name: Commit trophies.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/trophies.svg

          git commit -m "Update GitHub trophies" || exit 0

          git push
